  <script>
    // Suprimir ÚNICAMENTE errores de extensiones Chrome
    window.addEventListener('error', function(e) {
      if (e.message && (
          e.message.includes('message channel closed') || 
          e.message.includes('Extension context invalidated') ||
          e.message.includes('listener indicated an asynchronous response')
      )) {
          e.preventDefault();
          e.stopPropagation();
          return false;
      }
    });

    window.addEventListener('unhandledrejection', function(e) {
      if (e.reason && e.reason.message && (
          e.reason.message.includes('message channel closed') ||
          e.reason.message.includes('Extension context invalidated') ||
          e.reason.message.includes('listener indicated an asynchronous response')
      )) {
          e.preventDefault();
          return false;
      }
    });

    console.log('🛡️ Filtro de errores de extensiones Chrome activado');
  </script>
  <style>
    /* ========== ESTILOS ESPECÍFICOS DE PÁGINA ========== */
    body {
      background: url('img/fondo-lumai.png') center/cover no-repeat;
      background-attachment: fixed;
      position: relative;
    }

    /* Overlay muy sutil */

    /* 🎯 CONTROL DE VISIBILIDAD DEL BOTÓN - SOLUCIÓN DEFINITIVA */
    
    /* Estado por defecto: visible en modo explicación */
    #leerExplicacion {

<body class="modo-explicacion">

  <!-- Scripts originales funcionales -->
  <script type="module" src="js/ui-controller.js"></script>
  <script nomodule>
    alert('Tu navegador no soporta la tecnología necesaria para esta aplicación.');
  </script>

  <!-- ✅ SCRIPT OPTIMIZADO - SIN LOOPS INFINITOS -->
  <script>
    // 🎯 VARIABLES PARA CONTROL DE PROCESAMIENTO
    let ultimoProcesamientoTexto = '';
    let procesamientoEnCurso = false;
    let contadorProcesos = 0;

    // Obtener nombre del estudiante
    let nombreEstudiante = 'estudiante';
    try {
      const datos = sessionStorage.getItem('datosLumai') || sessionStorage.getItem('datosFormulario') || sessionStorage.getItem('datosSession');
      if (datos) {
        const datosSession = JSON.parse(datos);
        nombreEstudiante = datosSession.nombreAlumno || datosSession.nombre || 'estudiante';
      }
    } catch (e) {
      console.log('No se pudieron cargar los datos de sesión');
    }

    // 🎯 FUNCIÓN DE CORRECCIÓN ESPECÍFICA
    function corregirErroresTexto(texto) {
      if (!texto || typeof texto !== 'string') return texto;
      
      // Corrección específica: "propongos" → "propongo"
      let textoCorregido = texto.replace(/propongos/gi, 'propongo');
      textoCorregido = textoCorregido.replace(/te propongos/gi, 'te propongo');
      textoCorregido = textoCorregido.replace(/que propongos/gi, 'que propongo');
      textoCorregido = textoCorregido.replace(/las propongos/gi, 'las propongo');
      
      return textoCorregido;
    }

    // 🎯 FUNCIÓN OPTIMIZADA: Limpiar emojis sin loops
    function limpiarEmojisRepetidos(texto) {
      if (!texto || typeof texto !== 'string') return texto;
      if (procesamientoEnCurso) return texto;
      
      const textoHash = texto.substring(0, 50) + texto.length;
      if (textoHash === ultimoProcesamientoTexto) {
        return texto; // Ya procesado
      }
      
      procesamientoEnCurso = true;
      contadorProcesos++;
      
      try {
        // Patrones específicos para limpiar emojis duplicados
        let textoLimpio = texto;
        
        // Patrón 1: Emoji espacio emoji idéntico
        textoLimpio = textoLimpio.replace(/([\u{1F300}-\u{1F9FF}])\s+\1/gu, '$1');
        
        // Patrón 2: Emoji emoji idéntico sin espacio
        textoLimpio = textoLimpio.replace(/([\u{1F300}-\u{1F9FF}])\1+/gu, '$1');
        
        // Limpiar espacios múltiples
        textoLimpio = textoLimpio.replace(/\s+/g, ' ').trim();
        
        ultimoProcesamientoTexto = textoHash;
        return textoLimpio;
        
      } finally {
        procesamientoEnCurso = false;
      }
    }

    // 🎯 FUNCIÓN SIMPLIFICADA: Procesar texto sin loops
    function procesarTextoElemento(elemento) {
      if (!elemento || procesamientoEnCurso) return;
      
      procesamientoEnCurso = true;
      
      try {
        // Procesar solo nodos de texto
        const walker = document.createTreeWalker(
          elemento,
          NodeFilter.SHOW_TEXT,
          null,
          false
        );
        
        const nodos = [];
        let nodo;
        while ((nodo = walker.nextNode())) {
          nodos.push(nodo);
        }
        
        nodos.forEach(nodoTexto => {
          const textoOriginal = nodoTexto.textContent;
          let textoLimpio = limpiarEmojisRepetidos(textoOriginal);
          textoLimpio = corregirErroresTexto(textoLimpio);
          
          if (textoOriginal !== textoLimpio) {
            nodoTexto.textContent = textoLimpio;
          }
        });
      } finally {
        procesamientoEnCurso = false;
      }
    }

    // 🎯 FUNCIÓN OPTIMIZADA: Detectar saludos sin loops
    function detectarYMarcarSaludo(elemento) {
      if (!elemento || procesamientoEnCurso) return;
      
      const parrafos = elemento.querySelectorAll('p, div');
      
      parrafos.forEach((nodo, index) => {
        const texto = nodo.textContent;
        
        // Detectar saludos con nombres en mayúsculas
        if (texto.includes('¡') && texto.includes('!') && /[A-ZAÉÍÓÚÑ]{3,}/.test(texto)) {
          console.log('🎯 Saludo detectado:', texto);
          
          if (index === 0 || !elemento.querySelector('.student-greeting')) {
            nodo.classList.add('student-greeting');
          } else {
            nodo.classList.add('final-greeting', 'student-greeting');
          }
        }
        
        // Detectar mensajes motivacionales
        if (texto.includes('ADELANTE') || texto.includes('SIGUE') || 
            texto.includes('EXCELENTE') || texto.includes('CONTINUEMOS') ||
            (texto.includes('🚀') && texto.length > 20)) {
          console.log('🎯 Mensaje final detectado:', texto);
          nodo.classList.add('lumai-final-message');
        }
      });
    }

    // 🎯 FUNCIÓN PARA ESTILOS DE BOTONES
    function aplicarEstilosBoton(btn) {
      const texto = btn.textContent || '';
      
      if (texto.includes('Ver Explicación') || 
          texto.includes('Volver a') ||
          texto.includes('📖') ||
          btn.getAttribute('onclick')?.includes('verExplicacion')) {
        
        btn.className = 'btn-volver-explicacion';
        btn.id = 'btnVolverExplicacion';
        console.log('🔵 Estilos aplicados a botón:', btn);
      }
    }

    // 🎯 OBSERVER OPTIMIZADO - Solo para cambios importantes
    let observerTimeout;
    let observacionesRealizadas = 0;
    
    const observer = new MutationObserver(function(mutations) {
      // Throttling: Solo procesar cada 2 segundos máximo
      if (observerTimeout) return;
      
      observerTimeout = setTimeout(() => {
        if (procesamientoEnCurso) {
          observerTimeout = null;
          return;
        }
        
        observacionesRealizadas++;
        
        // Solo procesar si hay cambios significativos
        let hayNuevosElementos = false;
        
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1 && node.tagName !== 'SCRIPT') {
              hayNuevosElementos = true;
              
              // Aplicar estilos a botones nuevos
              if (node.tagName === 'BUTTON') {
                aplicarEstilosBoton(node);
              } else if (node.querySelector) {
                node.querySelectorAll('button').forEach(aplicarEstilosBoton);
              }
            }
          });
        });
        
        // Solo procesar contenido si hay elementos realmente nuevos
        if (hayNuevosElementos && observacionesRealizadas % 3 === 1) {
          const contenido = document.getElementById('contenido');
          if (contenido) {
            procesarTextoElemento(contenido);
            detectarYMarcarSaludo(contenido);
          }
        }
        
        observerTimeout = null;
      }, 2000); // Reducido el throttling a 2 segundos
    });

    // 🎯 FUNCIÓN DE SALUDO INTERACTIVO
    function saludarLumai() {
      const personajes = document.querySelectorAll('.lumai-character-main');
      personajes.forEach(personaje => {
        personaje.style.animation = 'none';
        setTimeout(() => {
          personaje.style.animation = 'float-main 1s ease-in-out 2';
        }, 10);
      });
      
      const mensajes = [
        `¡Hola ${nombreEstudiante}! Estoy aquí para acompañarte en tu aprendizaje`,
        `¡Qué genial verte estudiando, ${nombreEstudiante}! Sigamos aprendiendo juntos`, 
        `¡Excelente ${nombreEstudiante}! Me encanta ayudarte a descubrir cosas nuevas`,
        `¡Hola ${nombreEstudiante}! ¿Necesitas ayuda con algo?`
      ];
      
      const mensajeAleatorio = mensajes[Math.floor(Math.random() * mensajes.length)];
      alert(mensajeAleatorio);
    }

    // 🎯 PROCESAMIENTO INICIAL CONTROLADO
    function procesamientoInicial() {
      if (procesamientoEnCurso) return;
      
      const contenido = document.getElementById('contenido');
      if (contenido) {
        procesarTextoElemento(contenido);
        detectarYMarcarSaludo(contenido);
      }
      
      document.querySelectorAll('button').forEach(aplicarEstilosBoton);
    }

    // Iniciar observación con configuración restrictiva
    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: false, // No observar cambios de atributos
      characterData: false // No observar cambios de texto
    });

    // Procesamiento inicial al cargar
    document.addEventListener('DOMContentLoaded', procesamientoInicial);

    // 🎯 PROCESAMIENTO PERIÓDICO REDUCIDO - Solo cada 60 segundos
    setInterval(() => {
      if (!procesamientoEnCurso && contadorProcesos < 10) {
        procesamientoInicial();
      }
    }, 60000); // Reducido a 1 vez por minuto

    console.log('✅ SISTEMA OPTIMIZADO ACTIVADO - Sin loops infinitos + Procesamiento eficiente');
  </script>
</body>
